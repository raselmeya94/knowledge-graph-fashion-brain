[project]
name = "fashiongpt"
version = "0.1.0"
description = "Product knowledge graph and chatbot for synthetic fashion product data."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a running local Neo4j instance",
]

[tool.setuptools.packages.find]
include = ["knowledge_graph*", "fashion_brain*"]
